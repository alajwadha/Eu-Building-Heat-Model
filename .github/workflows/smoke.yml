name: clean-clone smoke test

# The advertised reproduction command once failed on a fresh clone, because the
# release was published with code/ flattened away while the pipeline expects it.
# This runs the one-sample command on every push so that cannot recur silently.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: One-sample pipeline
        run: |
          python run.py \
            --scenario CURRENT_POLICIES \
            --samples 1 \
            --skip-download \
            --demand bottomup
      - name: Assert the run wrote results
        run: |
          test -s code/results/mc_CURRENT_POLICIES_bottomup.csv \
            || (echo "no Monte Carlo output written" && exit 1)
